# Pubblica StreamSync su GitHub Pages, solo dopo che unit test ed end-to-end sono passati.
# Requisito una tantum: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Le action sono fissate per SHA (aggiornate da Dependabot): un tag spostato non può iniettare codice nel deploy.
name: Pages

on:
  push:
    branches: [main, claude/nuvio-stremio-addon-manager-rquac8]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Unit test
        run: npm test
      - name: Installa Playwright (versione fissata)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test end-to-end (mock di Stremio, Nuvio e degli addon)
        run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepara il sito (solo i file dell'app, niente test o script)
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
