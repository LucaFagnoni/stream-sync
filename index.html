<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Addon Manager — Stremio and Nuvio</title>
  <meta name="description" content="Addon Manager: manage, reorder, update and copy the addons of your Stremio and Nuvio accounts from a single page.">
  <meta name="referrer" content="no-referrer">
  <!-- Le credenziali restano nel browser: la CSP limita script e form alla sola origine locale e
       impone Trusted Types (nessun innerHTML con stringhe arbitrarie).
       connect-src è aperto a https/http perché i manifest degli addon stanno su host arbitrari.
       frame-ancestors non è supportato nel <meta>: l'anti-clickjacking è in js/main.js. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; connect-src https: http:; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types addon-manager-icons addon-manager-sw">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="Addon Manager">
  <meta name="apple-mobile-web-app-title" content="Addon Manager">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12142f" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#board" data-i18n="Skip to the lists">Skip to the lists</a>
  <header class="topbar">
    <!-- Testi: data-i18n* = chiave inglese (js/i18n.js). Riga principale (logo + azioni): su telefono resta fissa in alto; la ricerca scorre con la pagina -->
    <div class="topbar-main">
      <div class="brand"><img class="logo-mark" src="img/logo.png" alt="" width="30" height="30"><strong>Addon Manager</strong></div>
      <div class="top-actions">
        <button id="save-all" type="button" class="btn primary" disabled></button>
        <button id="backup" type="button" class="btn" data-i18n-title="Backup and export" data-i18n-aria-label="Backup" title="Backup and export" aria-label="Backup">Backup</button>
        <button id="settings" type="button" class="icon-btn" data-i18n-title="Settings" data-i18n-aria-label="Settings" aria-label="Settings" title="Settings"></button>
        <button id="add-account" type="button" class="btn" data-i18n-title="Add account" data-i18n-aria-label="Add account" title="Add account" aria-label="Add account">+ Account</button>
      </div>
    </div>
    <div class="search">
      <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search all lists" data-i18n-aria-label="Search addons" aria-label="Search addons" autocomplete="off" spellcheck="false">
    </div>
  </header>
  <aside id="install-banner" class="install-banner" data-i18n-aria-label="App installation" aria-label="App installation" hidden></aside>
  <nav id="accounts" class="accounts" data-i18n-aria-label="Connected accounts" aria-label="Connected accounts"></nav>
  <main id="board" class="board" tabindex="-1"><noscript>This page requires JavaScript.</noscript></main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
